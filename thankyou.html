<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you from the Compound. Team</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,400;1,9..144,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--v:#6D28D9;--vm:#7C3AED;--vl:#8B5CF6;--vp:#EDE9FE;--ink:#0D0D0D;--white:#fff;--ff:'Fraunces',Georgia,serif;--fb:'DM Sans',sans-serif;--fm:'DM Mono',monospace;--ease:cubic-bezier(0.16,1,0.3,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;-webkit-font-smoothing:antialiased}
body{font-family:var(--fb);background:var(--ink);color:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center;overflow:hidden}
.bg-glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 50% at 50% 50%,rgba(109,40,217,.18) 0%,transparent 70%)}
.tag{font-family:var(--fm);font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:2rem;position:relative;z-index:1}


}
}
50%{opacity:1;transform:scale(1.3)}}
100%{stroke-dashoffset:0}}
.hl{font-family:var(--ff);font-size:clamp(2.4rem,5.5vw,4.2rem);font-weight:600;color:var(--white);letter-spacing:-.05em;line-height:.95;margin-bottom:.85rem;position:relative;z-index:1}
.hl em{font-style:italic;color:var(--vl)}
.sub{font-size:1rem;color:rgba(255,255,255,.42);line-height:1.72;max-width:420px;margin:0 auto 2.25rem;position:relative;z-index:1}
.detail{font-family:var(--fm);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.22);margin-bottom:2.5rem;position:relative;z-index:1}
.acts{display:flex;gap:.85rem;justify-content:center;flex-wrap:wrap;position:relative;z-index:1}
.btn-h{display:inline-flex;align-items:center;gap:.45rem;background:var(--v);color:var(--white);padding:.85rem 1.75rem;border-radius:8px;font-weight:600;font-size:.9rem;text-decoration:none;transition:all .2s}.btn-h:hover{background:var(--vm);transform:translateY(-2px);box-shadow:0 8px 28px rgba(109,40,217,.45)}
.btn-s{display:inline-flex;align-items:center;gap:.45rem;background:rgba(255,255,255,.07);color:rgba(255,255,255,.65);padding:.83rem 1.75rem;border-radius:8px;font-weight:500;font-size:.9rem;text-decoration:none;border:1.5px solid rgba(255,255,255,.12);transition:all .2s}.btn-s:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28)}

/* ── Background constellation ── */
#bg-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
</style>
</head>
<body>
<canvas id="bg-canvas" aria-hidden="true"></canvas>
<div class="bg-glow"></div>
<div class="tag">Message received</div>
<h1 class="hl">We have got <em>your message.</em></h1>
<p class="sub">Someone from our team will be in touch within 24 hours. If it is urgent, reach us directly at <a href="mailto:info@compounddigital.co" style="color:var(--vl);text-decoration:none">info@compounddigital.co</a>.</p>
<p class="detail">Response within 24 hours &nbsp;&middot;&nbsp; Business days</p>
<div class="acts">
  <a href="/" class="btn-h">Back to home &rarr;</a>
  <a href="/work" class="btn-s">See our work</a>
</div>

<script>
(function(){
  var canvas = document.getElementById('bg-canvas');
  if(!canvas) return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var ctx = canvas.getContext('2d');
  var W, H, particles, mouse = {x:-999, y:-999};
  var COUNT = 55, CONNECT = 120, MDIST = 100, V = '255,255,255';
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
  function makeP(){var big=Math.random()<0.15;return{x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*(big?.2:.45),vy:(Math.random()-.5)*(big?.2:.45),r:big?Math.random()*1.1+1.5:Math.random()*.65+0.45,o:big?Math.random()*.22+0.20:Math.random()*.12+0.08};}
  function init(){resize();particles=Array.from({length:COUNT},makeP);}
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<particles.length;i++){
      var p=particles[i],mx=p.x-mouse.x,my=p.y-mouse.y,md2=mx*mx+my*my;
      if(md2<MDIST*MDIST){var md=Math.sqrt(md2),str=1-md/MDIST;ctx.beginPath();ctx.strokeStyle='rgba('+V+','+str*.35+')';ctx.lineWidth=str*.9;ctx.moveTo(p.x,p.y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke();ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1+str*1.3),0,Math.PI*2);ctx.fillStyle='rgba('+V+','+(p.o+str*.3)+')';ctx.fill();continue;}
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba('+V+','+p.o+')';ctx.fill();
    }
    for(var i=0;i<particles.length;i++)for(var j=i+1;j<particles.length;j++){var dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,d2=dx*dx+dy*dy;if(d2<CONNECT*CONNECT){var d=Math.sqrt(d2),a=(1-d/CONNECT)*.12;ctx.beginPath();ctx.strokeStyle='rgba('+V+','+a+')';ctx.lineWidth=0.6;ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.stroke();}}
  }
  function update(){particles.forEach(function(p){p.x+=p.vx;p.y+=p.vy;if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;var dx=mouse.x-p.x,dy=mouse.y-p.y,d=Math.sqrt(dx*dx+dy*dy);if(d<MDIST&&d>0){var f=(MDIST-d)/MDIST*.009;p.vx+=(dx/d)*f;p.vy+=(dy/d)*f;}var spd=Math.sqrt(p.vx*p.vx+p.vy*p.vy);if(spd>.75){p.vx=p.vx/spd*.75;p.vy=p.vy/spd*.75;}p.vx*=.999;p.vy*=.999;});}
  function loop(){update();draw();requestAnimationFrame(loop);}
  window.addEventListener('mousemove',function(e){mouse.x=e.clientX;mouse.y=e.clientY;},{passive:true});
  window.addEventListener('resize',function(){resize();particles=Array.from({length:COUNT},makeP);});
  init();loop();
})();
</script>

</body></html>
